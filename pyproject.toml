[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazesearch"
version = "1.0.0"
description = "Blind and heuristic search on large grid mazes, with an interactive Streamlit lab."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Anush Goel" }]
keywords = ["search", "a-star", "bfs", "dfs", "heuristics", "maze", "streamlit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []  # The solvers need only the standard library.

[project.optional-dependencies]
app = ["streamlit>=1.40", "plotly>=5.20", "numpy>=1.24", "pandas>=2.0", "pillow>=10.0"]
dev = ["pytest>=8", "ruff>=0.5", "numpy>=1.24", "pandas>=2.0", "pillow>=10.0"]

[project.scripts]
mazesearch = "mazesearch.cli:main"

[tool.setuptools]
packages = ["mazesearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 79
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W"]
